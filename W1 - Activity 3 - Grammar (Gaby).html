<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar — For + Gerund vs. To + Infinitive | English with Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --terra:#C4553A;--terra-light:#F5EAE7;
  --cream:#F7F5F0;--cream-dark:#EDE9E2;
  --text:#1A1A18;--text2:#4A4A47;--text3:#888780;
  --border:#E0DED8;--card:#fff;
  --green-bg:#EAF3DE;--green-t:#27500A;--green-b:#3B6D11;
  --red-bg:#FCEBEB;--red-t:#791F1F;
  --amber-bg:#FAEEDA;--amber-t:#633806;
  --blue-bg:#E6F1FB;--blue-t:#0C447C;
  --gabriela:#7B3FA0;--gabriela-light:#F3ECF9;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.topbar{background:var(--gabriela);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#fff}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar-bg{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.prog-bar-fill{height:6px;border-radius:3px;background:#fff;transition:width .4s ease}
.prog-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.shell{max-width:780px;margin:0 auto;padding:2rem 1rem 5rem}
.phase-nav{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:2rem}
.phase-tab{flex:1;padding:.75rem .5rem;text-align:center;cursor:pointer;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s;border-right:1px solid var(--border)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--gabriela);color:#fff}
.phase-tab .tab-num{display:block;font-size:18px;font-weight:700;margin-bottom:2px}
.phase-tab .tab-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.section-intro{text-align:center;padding:2rem 0 1.5rem}
.section-intro h2{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--gabriela);margin-bottom:.4rem}
.section-intro p{font-size:14px;color:var(--text3);max-width:540px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.card-title{font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;color:var(--text);margin-bottom:.75rem}
.grammar-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:1rem}
.grammar-table th{background:var(--gabriela);color:#fff;text-align:left;padding:.55rem .85rem;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.grammar-table th:first-child{border-radius:8px 0 0 0}
.grammar-table th:last-child{border-radius:0 8px 0 0}
.grammar-table td{padding:.6rem .85rem;border-bottom:1px solid var(--border);vertical-align:top;color:var(--text2);line-height:1.5;font-size:13px}
.grammar-table tr:last-child td{border-bottom:none}
.grammar-table td.form{font-family:monospace;color:var(--gabriela);font-weight:700;font-size:13px}
.ex-item{background:var(--cream);border-radius:8px;padding:.65rem .9rem;font-size:13px;color:var(--text2);line-height:1.5;border-left:3px solid var(--teal-mid);margin-bottom:.4rem}
.ex-item strong{color:var(--teal-dark);font-weight:700}
.ex-item.wrong{border-left-color:#E24B4A;background:var(--red-bg);color:var(--red-t)}
.ex-item.right{border-left-color:var(--green-b);background:var(--green-bg);color:var(--green-t)}
.amber-box{background:var(--amber-bg);border-left:3px solid #BA7517;border-radius:0 8px 8px 0;padding:.7rem 1rem;margin-bottom:1rem;font-size:13px;color:var(--amber-t);line-height:1.55}
.tip-box{background:var(--blue-bg);border-radius:8px;padding:.65rem .9rem;margin-bottom:1rem;font-size:13px;color:var(--blue-t);line-height:1.5}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.quiz-num{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.quiz-situation{background:var(--gabriela-light);border-left:3px solid var(--gabriela);border-radius:0 8px 8px 0;padding:.6rem .9rem;font-size:13px;color:#3D1A55;margin-bottom:1rem}
.quiz-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;transition:all .15s;font-family:'Lato',sans-serif;width:100%}
.q-opt:hover{border-color:var(--gabriela);background:var(--gabriela-light)}
.q-opt.correct{border-color:var(--green-b);background:var(--green-bg)}
.q-opt.incorrect{border-color:#E24B4A;background:var(--red-bg)}
.q-opt.revealed{border-color:var(--green-b);background:var(--green-bg)}
.q-letter{min-width:22px;height:22px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.q-opt.correct .q-letter,.q-opt.revealed .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-opt.incorrect .q-letter{background:#E24B4A;border-color:#E24B4A;color:#fff}
.q-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-feedback{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:var(--green-bg);color:var(--green-t);border-left:3px solid var(--green-b)}
.quiz-feedback.incorrect{background:var(--red-bg);color:var(--red-t);border-left:3px solid #E24B4A}
.write-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.write-ta{width:100%;min-height:90px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;outline:none;transition:border-color .15s;line-height:1.6;background:var(--cream)}
.write-ta:focus{border-color:var(--gabriela);background:#fff;box-shadow:0 0 0 3px rgba(123,63,160,.1)}
.check-btn{margin-top:.75rem;padding:.5rem 1.1rem;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.check-btn:hover{border-color:var(--gabriela);color:var(--gabriela)}
.check-btn.done{background:var(--gabriela-light);border-color:var(--gabriela);color:var(--gabriela)}
.model-answer{margin-top:.75rem;padding:.65rem .9rem;background:var(--gabriela-light);border-left:3px solid var(--gabriela);border-radius:0 8px 8px 0;font-size:13px;color:#3D1A55;line-height:1.55;display:none}
.model-answer.show{display:block}
.results-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center;margin-bottom:1.25rem}
.result-score{font-family:'Raleway',sans-serif;font-size:54px;font-weight:700;color:var(--gabriela);line-height:1}
.result-denom{font-size:20px;color:var(--text3)}
.result-note{font-size:14px;color:var(--text2);max-width:420px;margin:.75rem auto 0;line-height:1.6}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.nav-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-btn.primary{background:var(--gabriela);border-color:var(--gabriela);color:#fff}
@media(max-width:580px){.shell{padding:1.5rem .75rem 5rem}}
</style>
<style id="print-css">
@media print {
  body { background: #fff !important; }
  .topbar, .phase-nav, .botnav, #print-fab { display: none !important; }
  .shell { max-width: 100% !important; padding: 1rem !important; }
  .word-card, .quiz-card, .write-card, .reflect-card, .card, .listen-card, .pretask-card { break-inside: avoid; margin-bottom: 1rem; box-shadow: none !important; border: 1px solid #ddd !important; }
  .wc-body, .model-answer, .quiz-feedback, .self-eval { display: block !important; }
  .write-ta { min-height: 60px; border: 1px solid #ccc; background: #fff; }
  a { color: #0F6E56; }
}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="topbar-title">Grammar — For + Gerund vs. To + Infinitive</div>
    <div class="topbar-sub">English with Ali · Gabriela</div>
  </div>
  <div class="prog-wrap">
    <div class="prog-bar-bg"><div class="prog-bar-fill" id="prog" style="width:0%"></div></div>
    <span class="prog-label" id="prog-label">Phase 1 of 3</span>
  </div>
</div>

<div class="shell">
  <div class="phase-nav">
    <div class="phase-tab active" id="tab-0" onclick="goPhase(0)"><span class="tab-num">1</span><span class="tab-lbl">Learn</span></div>
    <div class="phase-tab" id="tab-1" onclick="goPhase(1)"><span class="tab-num">2</span><span class="tab-lbl">Quiz</span></div>
    <div class="phase-tab" id="tab-2" onclick="goPhase(2)"><span class="tab-num">3</span><span class="tab-lbl">Write</span></div>
  </div>
  <div id="phase-0"></div>
  <div id="phase-1" style="display:none"></div>
  <div id="phase-2" style="display:none"></div>
</div>

<script>
let currentPhase=0;
const quizAnswers={};
const writeAnswers={};
const writeSelf={};

function updateProgress(){
  const pcts=[33,66,100];
  const labels=['Phase 1 of 3 — Learn','Phase 2 of 3 — Quiz','Phase 3 of 3 — Write'];
  document.getElementById('prog').style.width=pcts[currentPhase]+'%';
  document.getElementById('prog-label').textContent=labels[currentPhase];
}

function goPhase(n){
  document.getElementById('phase-'+currentPhase).style.display='none';
  document.querySelectorAll('.phase-tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  currentPhase=n;document.getElementById('phase-'+n).style.display='block';
  updateProgress();window.scrollTo({top:0,behavior:'smooth'});
  if(n===1)renderQuiz();if(n===2)renderWrite();
}

function renderLearn(){
  const el=document.getElementById('phase-0');
  let html=`<div class="section-intro"><h2>For + Gerund vs. To + Infinitive</h2><p>In class today you wrote: "we have been asked for be in a meeting." This is a pattern that appears across your writing and speaking. Today we fix it — permanently.</p></div>`;

  html+=`<div class="card">
    <div class="card-title">🔍 From your email today — the exact error</div>
    <div class="ex-item wrong">❌ "we have been asked <strong>for be</strong> in a meeting after lunch"</div>
    <div class="ex-item right">✓ "we have been asked <strong>to be</strong> in a meeting after lunch"</div>
    <div class="amber-box" style="margin-top:.75rem"><strong>What happened:</strong> In Spanish, "para + infinitivo" is common. In English, after verbs like <em>ask, tell, want, need, expect, invite</em>, you use <strong>to + infinitive</strong> — not "for + verb."</div>
  </div>`;

  html+=`<div class="card">
    <div class="card-title">📋 The core rule</div>
    <table class="grammar-table">
      <thead><tr><th>Structure</th><th>Form</th><th>When to use</th></tr></thead>
      <tbody>
        <tr><td><strong>to + infinitive</strong><br>(after verbs of request, instruction, desire)</td><td class="form">to + base verb</td><td>After: ask, tell, want, need, expect, invite, encourage, allow, require, force</td></tr>
        <tr><td><strong>for + gerund</strong><br>(purpose or function)</td><td class="form">for + verb-ing</td><td>Explaining the purpose of a thing or action. Often answers "what is it used for?"</td></tr>
        <tr><td><strong>for + noun</strong></td><td class="form">for + noun phrase</td><td>After verbs like thank, ask, apply, wait, look, prepare</td></tr>
      </tbody>
    </table>
    <div class="tip-box">💡 <strong>Quick test:</strong> If you can replace the structure with "in order to," use <strong>to + infinitive</strong>. If you're describing a purpose or function of something, use <strong>for + gerund</strong>.</div>
  </div>`;

  html+=`<div class="card">
    <div class="card-title">📝 Examples — professional context</div>
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gabriela);margin-bottom:.5rem">✓ to + infinitive (after verbs of request/instruction)</div>
    <div class="ex-item">We were asked <strong>to attend</strong> a briefing on human rights standards. <span style="font-size:11px;color:var(--text3)">— asked + to + base verb</span></div>
    <div class="ex-item">The coordinator told us <strong>to submit</strong> our reports by Friday. <span style="font-size:11px;color:var(--text3)">— told + to + base verb</span></div>
    <div class="ex-item">The trainer encouraged participants <strong>to contribute</strong> to the discussion. <span style="font-size:11px;color:var(--text3)">— encouraged + to + base verb</span></div>
    <div class="ex-item">I need <strong>to prepare</strong> a summary of the session. <span style="font-size:11px;color:var(--text3)">— need + to + base verb</span></div>
    <br>
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--gabriela);margin-bottom:.5rem">✓ for + gerund (purpose/function)</div>
    <div class="ex-item">This platform is useful <strong>for sharing</strong> documents across teams. <span style="font-size:11px;color:var(--text3)">— for + gerund: purpose</span></div>
    <div class="ex-item">We use this database <strong>for tracking</strong> cases. <span style="font-size:11px;color:var(--text3)">— for + gerund: function</span></div>
    <div class="ex-item">Thank you <strong>for attending</strong> today's session. <span style="font-size:11px;color:var(--text3)">— thank + for + gerund (fixed expression)</span></div>
    <br>
    <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:#E24B4A;margin-bottom:.5rem">❌ Common errors — from your output</div>
    <div class="ex-item wrong">❌ "asked for be" → ✓ "asked to be"</div>
    <div class="ex-item wrong">❌ "I like to do exercise" → ✓ "I like doing exercise" or "I like to exercise"</div>
    <div class="ex-item wrong">❌ "I can apport to the conversation" → ✓ "I can contribute to the conversation"</div>
  </div>`;

  html+=`<div class="card">
    <div class="card-title">⚡ Key verbs — memorize these patterns</div>
    <table class="grammar-table">
      <thead><tr><th>Verb</th><th>Pattern</th><th>Example</th></tr></thead>
      <tbody>
        <tr><td>ask</td><td class="form">ask someone to do</td><td>She asked me to present the findings.</td></tr>
        <tr><td>tell</td><td class="form">tell someone to do</td><td>The trainer told us to take notes.</td></tr>
        <tr><td>want</td><td class="form">want someone to do</td><td>I want the team to be prepared.</td></tr>
        <tr><td>need</td><td class="form">need to do</td><td>I need to review the materials.</td></tr>
        <tr><td>invite</td><td class="form">invite someone to do</td><td>We were invited to share our perspectives.</td></tr>
        <tr><td>thank</td><td class="form">thank someone for doing</td><td>Thank you for joining us today.</td></tr>
        <tr><td>apologize</td><td class="form">apologize for doing</td><td>I apologize for the late response.</td></tr>
        <tr><td>prepare</td><td class="form">prepare for something</td><td>I'm preparing for the Geneva training.</td></tr>
      </tbody>
    </table>
  </div>`;

  html+=`<div class="bottom-nav"><span style="font-size:13px;color:var(--text3)">Study the table carefully.</span><button class="nav-btn primary" onclick="goPhase(1)">Continue to Quiz →</button></div>`;
  el.innerHTML=html;
}

const QUIZ=[
  {id:'q1',situation:'You\'re writing an email to reschedule a meeting.',prompt:'Choose the correct sentence.',
    options:['We have been asked for attending a different session.','We have been asked to attend a different session.','We have been asked for attend a different session.','We have been asked attending a different session.'],
    correct:1,explain:'"Asked to attend" — this is the pattern: asked + someone + to + base verb. This is the exact structure from your email today, corrected.'},
  {id:'q2',situation:'You\'re explaining the purpose of a document to a new colleague.',prompt:'Which sentence uses "for + gerund" correctly?',
    options:['This template is for to write reports quickly.','This template is for write reports quickly.','This template is for writing reports quickly.','This template is to writing reports quickly.'],
    correct:2,explain:'"For writing" — when you describe the purpose or function of something, use for + gerund. "For to write" is never correct in standard English.'},
  {id:'q3',situation:'Describing your preparation for the Geneva training.',prompt:'Which sentence is correct?',
    options:['I am preparing for attend the Advanced Training Course in July.','I am preparing for to attend the Advanced Training Course in July.','I am preparing to attend the Advanced Training Course in July.','I am preparing for attending the Advanced Training Course in July.'],
    correct:2,explain:'"Preparing to attend" — "prepare to do something" uses to + infinitive. However, "preparing for the training" (for + noun) is also correct. The error is "for + infinitive" — that form doesn\'t exist in English.'},
  {id:'q4',situation:'Thanking someone at the end of a training session.',prompt:'Choose the most natural and correct sentence.',
    options:['Thank you for to share your experience with us.','Thank you for shared your experience with us.','Thank you to share your experience with us.','Thank you for sharing your experience with us.'],
    correct:3,explain:'"Thank you for sharing" — "thank someone for + gerund" is a fixed expression. Always use the gerund (-ing form) after "thank you for."'},
  {id:'q5',situation:'You\'re contributing to a discussion in English and want to add a point.',prompt:'Which sentence correctly uses "contribute"? (Remember: "apport" is not English.)',
    options:['I\'d like to apport something to this discussion.','I\'d like to contribute to this discussion.','I\'d like contributing to this discussion.','I\'d like for contribute to this discussion.'],
    correct:1,explain:'"Contribute to" — this is the correct verb and preposition. "Apport" is a false cognate from Spanish/French; it doesn\'t exist in English. Also note: "I\'d like to contribute" — like + to + infinitive.'},
  {id:'q6',situation:'You\'re describing your role in Geneva to a colleague.',prompt:'Which sentence is grammatically correct and professionally natural?',
    options:['I was invited for present my country\'s experience.','I was invited to present my country\'s experience.','I was invited for presenting my country\'s experience.','I was invited to presenting my country\'s experience.'],
    correct:1,explain:'"Invited to present" — invited + to + infinitive. This pattern (verb of invitation + to + base verb) is consistent: invited to, asked to, encouraged to, expected to.'},
];

const WRITE_TASKS=[
  {prompt:'Rewrite these three sentences from your output today — using the correct structure.',
    hint:'Each one has the same error: "for + verb" where it should be "to + verb" or a different verb entirely.',
    sentences:[
      '"we have been asked for be in a meeting after lunch"',
      '"I can apport to the conversation"',
      '"I like to do exercise"'
    ],
    model:'1. "We have been asked to be in a meeting after lunch." / 2. "I can contribute to the conversation." / 3. "I like doing exercise." or "I enjoy exercising."'},
  {prompt:'Write 3 sentences about preparing for Geneva — one using "to + infinitive", one using "for + gerund", and one using "for + noun".',
    hint:'Think about: what you need to do, what you\'re using tools for, what you\'re preparing for.',
    model:'"I need to review the course materials before the training begins." (to + infinitive) / "I use Grammarly for checking my written English before sending emails." (for + gerund) / "I am preparing for the Advanced Training Course in July." (for + noun)'},
  {prompt:'Write a 4–5 sentence paragraph about what you\'ve been asked to do or what you\'re preparing for at work. Use at least three different patterns from today\'s lesson.',
    hint:'Think about your current workload, your upcoming trip, or your role at OACNUDH. Be specific.',
    model:'"I have recently been asked to coordinate a series of consultations with civil society organizations. I am also preparing for the Geneva training, which requires me to review international standards in law enforcement. My supervisor encouraged me to attend additional sessions to strengthen my technical English. I am using the online resources recommended by Ali for practicing vocabulary and listening comprehension. I look forward to contributing to the discussions in Geneva."'},
];

function renderQuiz(){
  const el=document.getElementById('phase-1');
  let html=`<div class="section-intro"><h2>Phase 2 — Quiz</h2><p>Apply the rule. Each question uses a realistic professional situation.</p></div>`;
  QUIZ.forEach((q,qi)=>{
    const answered=quizAnswers[q.id]!==undefined;
    html+=`<div class="quiz-card">
      <div class="quiz-num">Question ${qi+1} of ${QUIZ.length}</div>
      <div class="quiz-situation"><strong>Situation:</strong> ${q.situation}</div>
      <div class="quiz-prompt">${q.prompt}</div>
      <div class="quiz-options">`;
    q.options.forEach((opt,oi)=>{
      let cls='';if(answered){if(oi===q.correct)cls='revealed';else if(quizAnswers[q.id]===oi)cls='incorrect';}
      html+=`<button class="q-opt ${cls}" onclick="answerQuiz(this)" data-qid="${q.id}" data-oi="${oi}"><span class="q-letter">${String.fromCharCode(65+oi)}</span><span class="q-text">${opt}</span></button>`;
    });
    html+=`</div>`;
    if(answered){const ok=quizAnswers[q.id]===q.correct;html+=`<div class="quiz-feedback ${ok?'correct':'incorrect'} show">${ok?'✓ ':'✗ '}${q.explain}</div>`;}
    html+=`</div>`;
  });
  const allDone=Object.keys(quizAnswers).length===QUIZ.length;
  const correct=QUIZ.filter(q=>quizAnswers[q.id]===q.correct).length;
  if(allDone){html+=`<div class="results-card"><div class="result-score">${correct}<span class="result-denom">/${QUIZ.length}</span></div><div style="font-size:14px;color:var(--text3);margin-top:4px">correct</div><p class="result-note">${correct>=5?'Excellent. You\'ve got it — move to the writing practice and lock it in.':correct>=4?'Good. Review the ones you missed, then continue.':'Read Phase 1 again before continuing. Pay close attention to the verb + pattern combinations.'}</p></div>`;}
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(0)">← Learn</button><button class="nav-btn primary" onclick="goPhase(2)" ${allDone?'':'disabled'}>Write →</button></div>`;
  el.innerHTML=html;
}

function answerQuiz(btn){
  const qid=btn.dataset.qid;const oi=parseInt(btn.dataset.oi);
  if(quizAnswers[qid]!==undefined)return;
  quizAnswers[qid]=oi;renderQuiz();
  setTimeout(()=>{const fb=document.querySelector('#phase-1 .quiz-feedback.show:last-of-type');if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});},80);
}

function renderWrite(){
  const el=document.getElementById('phase-2');
  let html=`<div class="section-intro"><h2>Phase 3 — Write</h2><p>Use the structures in your own context. Your sentences should be ones you could actually say or write at work.</p></div>`;
  WRITE_TASKS.forEach((task,ti)=>{
    const val=writeAnswers[ti]||'';
    const selfVal=writeSelf[ti]||'';
    const showModel=selfVal!=='';
    let extraHtml='';
    if(task.sentences){
      extraHtml=`<div style="background:var(--cream-dark);border-radius:8px;padding:.75rem;margin-bottom:.75rem;font-size:13px;color:var(--text2);line-height:1.6"><strong>Rewrite these:</strong><br>${task.sentences.map((s,i)=>`${i+1}. ${s}`).join('<br>')}</div>`;
    }
    html+=`<div class="write-card">
      <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--text3);margin-bottom:.5rem">Writing task ${ti+1} of ${WRITE_TASKS.length}</div>
      <div style="font-size:15px;font-weight:600;color:var(--text);margin-bottom:.5rem;line-height:1.5">${task.prompt}</div>
      <div style="font-size:12px;color:var(--text3);font-style:italic;margin-bottom:.75rem">💭 ${task.hint}</div>
      ${extraHtml}
      <textarea class="write-ta" id="wta-${ti}" placeholder="Write here…" oninput="recordWrite(${ti},this.value)">${escHtml(val)}</textarea>
      <div style="margin-top:.75rem;${val.trim().length>10?'display:block':'display:none'}" id="se-${ti}">
        <div style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.4rem">How confident do you feel?</div>
        <div style="display:flex;gap:7px;flex-wrap:wrap">
          <button class="check-btn ${selfVal==='yes'?'done':''}" onclick="pickSelf(${ti},'yes',this)">✓ Confident</button>
          <button class="check-btn ${selfVal==='unsure'?'done':''}" onclick="pickSelf(${ti},'unsure',this)">? Unsure</button>
          <button class="check-btn ${selfVal==='no'?'done':''}" onclick="pickSelf(${ti},'no',this)">✗ Struggled</button>
        </div>
      </div>
      <button class="check-btn ${showModel?'done':''}" onclick="showModel(${ti})">${showModel?'✓ Example shown':'See an example'}</button>
      <div class="model-answer ${showModel?'show':''}" id="ma-${ti}"><strong>Example:</strong> ${task.model}<br><span style="font-size:11px;color:var(--gabriela);margin-top:.4rem;display:block">Compare your version — check that every "for/to + verb" is correct.</span></div>
    </div>`;
  });
  const done=Object.values(writeAnswers).filter(v=>v&&v.trim().length>5).length;
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(1)">← Quiz</button><div style="text-align:center"><div style="font-size:13px;color:var(--text3)">${done} of ${WRITE_TASKS.length} completed</div>${done>=WRITE_TASKS.length?'<div style="font-size:13px;font-weight:600;color:var(--gabriela)">✓ Done! Send to Ali on WhatsApp.</div>':''}</div><button class="nav-btn" onclick="goPhase(0)">Restart ↺</button></div>`;
  el.innerHTML=html;
}

function recordWrite(ti,val){writeAnswers[ti]=val;const se=document.getElementById('se-'+ti);if(se)se.style.display=val.trim().length>10?'block':'none';}
function pickSelf(ti,val,btn){writeSelf[ti]=val;document.getElementById('ma-'+ti).classList.add('show');btn.classList.add('done');}
function showModel(ti){document.getElementById('ma-'+ti).classList.add('show');}
function escHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

renderLearn();updateProgress();
</script>

<div id="print-fab" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:999">
  <button onclick="exportPDF()" style="display:flex;align-items:center;gap:.5rem;background:#0F6E56;color:#fff;border:none;border-radius:12px;padding:.65rem 1.25rem;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:all .2s" onmouseover="this.style.background='#1D9E75'" onmouseout="this.style.background='#0F6E56'">
    📄 Export as PDF
  </button>
</div>

<script>
function exportPDF(){
  // 1. Show all hidden phases/sections
  const hidden = document.querySelectorAll('[style*="display:none"], [style*="display: none"]');
  const hiddenEls = [];
  hidden.forEach(el => {
    hiddenEls.push({el, style: el.getAttribute('style')});
    el.style.display = 'block';
  });

  // 2. Hide the FAB itself
  document.getElementById('print-fab').style.display = 'none';

  // 3. Also hide nav buttons and topbar dots for cleaner output
  const navEls = document.querySelectorAll('.botnav, .topbar, .phase-nav, #print-fab');
  navEls.forEach(el => el.style.display = 'none');

  // 4. Print
  window.print();

  // 5. Restore everything after print dialog closes
  setTimeout(() => {
    hiddenEls.forEach(({el, style}) => el.setAttribute('style', style));
    navEls.forEach(el => el.style.display = '');
    document.getElementById('print-fab').style.display = 'flex';
  }, 500);
}
</script>

</body>
</html>
