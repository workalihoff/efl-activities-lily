<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keeping It in the Past — Week 3 | English with Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --terra:#C4553A;--terra-light:#F5EAE7;
  --cream:#F7F5F0;--cream-dark:#EDE9E2;
  --text:#1A1A18;--text2:#4A4A47;--text3:#888780;
  --border:#E0DED8;--card:#fff;
  --green-bg:#EAF3DE;--green-t:#27500A;--green-b:#3B6D11;
  --red-bg:#FCEBEB;--red-t:#791F1F;
  --blue-bg:#E6F1FB;--blue-t:#0C447C;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.topbar{background:var(--teal);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#fff}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar-bg{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.prog-bar-fill{height:6px;border-radius:3px;background:#fff;transition:width .4s ease}
.prog-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.shell{max-width:780px;margin:0 auto;padding:2rem 1rem 5rem}
.section-intro{text-align:center;padding:2rem 0 1.5rem}
.section-intro h2{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.section-intro p{font-size:14px;color:var(--text3);max-width:540px;margin:0 auto}
.es-note{font-size:12.5px;color:var(--text3);font-style:italic;margin-top:.3rem}
.phase-nav{display:flex;gap:0;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:2rem}
.phase-tab{flex:1;padding:.75rem .5rem;text-align:center;cursor:pointer;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:13px;font-weight:600;color:var(--text3);border-right:1px solid var(--border)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--teal);color:#fff}
.phase-tab .tab-num{display:block;font-size:18px;font-weight:700;margin-bottom:2px}
.phase-tab .tab-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.howto-card{background:var(--teal-light);border:1.5px dashed #9FE1CB;border-radius:14px;padding:1.1rem 1.4rem;margin-bottom:1.5rem}
.howto-card .ht-title{font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;color:var(--teal-dark);margin-bottom:.6rem}
.howto-step{display:flex;align-items:flex-start;gap:10px;margin-bottom:.5rem}
.howto-step:last-child{margin-bottom:0}
.howto-step .hs-num{width:20px;height:20px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.howto-step p{font-size:13px;color:var(--teal-dark);line-height:1.5;margin:0}
.howto-step .es{color:var(--teal);opacity:.8;font-style:italic;display:block;font-size:12px;margin-top:2px}
.before-after{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.4rem 1.6rem;margin-bottom:1.25rem}
.ba-label{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:.5rem}
.ba-before{background:var(--red-bg);border-radius:8px;padding:.7rem 1rem;margin-bottom:.6rem}
.ba-before .ba-label{color:var(--red-t)}
.ba-before p{color:var(--red-t);font-size:13.5px;line-height:1.6}
.ba-after{background:var(--green-bg);border-radius:8px;padding:.7rem 1rem}
.ba-after .ba-label{color:var(--green-t)}
.ba-after p{color:var(--green-t);font-size:13.5px;line-height:1.6}
.ba-why{font-size:12.5px;color:var(--text3);margin-top:.6rem;font-style:italic}
.tip-box{background:var(--blue-bg);border-radius:8px;padding:.65rem .9rem;margin-top:.75rem;font-size:13px;color:var(--blue-t);line-height:1.5}
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.quiz-num{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.quiz-situation{background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;padding:.6rem .9rem;font-size:13px;color:var(--teal-dark);margin-bottom:1rem}
.quiz-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;width:100%;font-family:'Lato',sans-serif}
.q-opt:hover{border-color:#9FE1CB;background:var(--teal-light)}
.q-opt.correct{border-color:var(--green-b);background:var(--green-bg)}
.q-opt.incorrect{border-color:#E24B4A;background:var(--red-bg)}
.q-opt.revealed{border-color:var(--green-b);background:var(--green-bg)}
.q-letter{min-width:22px;height:22px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.q-opt.correct .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-opt.incorrect .q-letter{background:#E24B4A;border-color:#E24B4A;color:#fff}
.q-opt.revealed .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-feedback{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:var(--green-bg);color:var(--green-t);border-left:3px solid var(--green-b)}
.quiz-feedback.incorrect{background:var(--red-bg);color:var(--red-t);border-left:3px solid #E24B4A}
.quiz-encourage{font-size:12px;margin-top:.4rem;font-style:italic;opacity:.85}
.write-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.write-reminder{background:var(--cream);border-radius:8px;padding:.6rem .9rem;font-size:12px;color:var(--text3);margin-bottom:1rem;line-height:1.5}
.write-ta{width:100%;min-height:120px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;background:var(--cream)}
.write-ta:focus{border-color:var(--teal-mid);background:#fff}
.word-bank{display:flex;flex-wrap:wrap;gap:6px;margin-top:.75rem}
.wb-chip{background:var(--teal-light);color:var(--teal-dark);font-size:12px;font-weight:700;padding:4px 12px;border-radius:12px}
.checklist{display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem}
.cl-item{display:flex;align-items:center;gap:10px;background:var(--cream);border-radius:8px;padding:.6rem .9rem;font-size:13px;color:var(--text2)}
.cl-item .box{width:16px;height:16px;border:2px solid var(--teal-mid);border-radius:4px;flex-shrink:0}
.results-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2.5rem;text-align:center;margin-bottom:1.25rem}
.result-score{font-family:'Raleway',sans-serif;font-size:54px;font-weight:700;color:var(--teal);line-height:1}
.result-denom{font-size:20px;color:var(--text3)}
.result-note{font-size:14px;color:var(--text2);max-width:420px;margin:.75rem auto 0;line-height:1.6}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.nav-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-btn:hover{border-color:var(--teal-mid)}
.nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
.export-box{text-align:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.export-btn{padding:.7rem 1.6rem;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;font-family:'Lato',sans-serif;background:var(--terra);border:1px solid var(--terra);color:#fff}
.export-btn:hover{opacity:.9}
@media(max-width:580px){.shell{padding:1.5rem .75rem 5rem}}
@media print{
  .topbar,.phase-nav,.bottom-nav,.export-box{display:none !important}
  #phase-0,#phase-1,#phase-2{display:block !important}
  .no-print{display:none !important}
  body{background:#fff}
  .shell{padding:0;max-width:100%}
}
</style>
</head>
<body>
<div class="topbar">
  <div><div class="topbar-title">Keeping It in the Past — Week 3</div><div class="topbar-sub">English with Ali · One Tense, Whole Story</div></div>
  <div class="prog-wrap"><div class="prog-bar-bg"><div class="prog-bar-fill" id="prog" style="width:0%"></div></div><span class="prog-label" id="prog-label">Phase 1 of 3</span></div>
</div>
<div class="shell">
  <div class="phase-nav">
    <div class="phase-tab active" id="tab-0" onclick="goPhase(0)"><span class="tab-num">1</span><span class="tab-lbl">Learn</span></div>
    <div class="phase-tab" id="tab-1" onclick="goPhase(1)"><span class="tab-num">2</span><span class="tab-lbl">Quiz</span></div>
    <div class="phase-tab" id="tab-2" onclick="goPhase(2)"><span class="tab-num">3</span><span class="tab-lbl">Write</span></div>
  </div>
  <div id="phase-0"></div>
  <div id="phase-1" style="display:none"></div>
  <div id="phase-2" style="display:none"></div>
</div>

<script>
const EXAMPLES = [
  {before:'First, I go to school. Then, study different course. After that, I put away all my study materials. Finally, arrived in my house.',
   after:'First, I went to school. Then, I studied a different subject. After that, I put away all my study materials. Finally, I arrived at my house.',
   why:'The whole story already happened — so every verb stays in the past, from "First" to "Finally."'},
];

const QUIZ = [
  {id:'q1', situation:'You are telling a story about something that already happened yesterday.', prompt:'Which sentence keeps the past tense correctly?',
    options:['First, I go to the market. Then, I helped my mom.','First, I went to the market. Then, I help my mom.','First, I went to the market. Then, I helped my mom.','First, I going to the market. Then, I help my mom.'],
    correct:2, explain:'Correct! Both verbs stay in the past — "went" and "helped."', encourage:'Nice! 🌱'},
  {id:'q2', situation:'Read this sentence: "After that, we go to the party."', prompt:'This is about last week. What\'s the correct past tense verb?',
    options:['go','goes','went','going'], correct:2, explain:'Correct! "Went" is the past tense of "go."', encourage:'Great catch! 👏'},
  {id:'q3', situation:'Read this sentence: "Finally, arrived in my house."', prompt:'What is missing to make this a complete, correct sentence?',
    options:['Nothing, it\'s correct','The subject "I"','A connector word','The word "house"'], correct:1, explain:'Correct! "Finally, I arrived at my house." — every sentence needs a subject.', encourage:'Sharp eye! ✨'},
  {id:'q4', situation:'You are checking your own story for mistakes.', prompt:'Which is the best strategy?',
    options:['Check that every sentence sounds nice','Check that every verb is in the same tense as the others','Check that the story is long','Check that you used every connector'], correct:1, explain:'Correct! Tense consistency is the key thing to check when telling a story about the past.', encourage:'That\'s the idea! 🎯'},
  {id:'q5', situation:'Read this pair of sentences: "Next, the teacher took us to an activity. Next, we sang songs."', prompt:'What could make this sound more natural?',
    options:['Nothing, it\'s perfect','Use a different connector for the second sentence, like "Then"','Change "sang" to "sing"','Remove "the teacher"'], correct:1, explain:'Correct! Using different connectors (First, Then, After that, Next, Finally) makes a story flow better than repeating the same one.', encourage:'Great ear! 🌟'},
];

let currentPhase = 0;
const quizAnswers = {};
const writeAnswers = {mystory:''};

function updateProgress(){
  const phases = ['Phase 1 of 3 — Learn','Phase 2 of 3 — Quiz','Phase 3 of 3 — Write'];
  document.getElementById('prog').style.width = [33,66,100][currentPhase] + '%';
  document.getElementById('prog-label').textContent = phases[currentPhase];
}
function goPhase(n){
  document.getElementById('phase-'+currentPhase).style.display='none';
  document.querySelectorAll('.phase-tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  currentPhase=n;
  document.getElementById('phase-'+n).style.display='block';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
  if(n===1) renderQuiz();
  if(n===2) renderWrite();
}

function renderLearn(){
  const el = document.getElementById('phase-0');
  let html = `<div class="section-intro"><h2>Phase 1 — One Tense, Whole Story</h2><p>When you tell a story about something that already happened, every verb stays in the past — from beginning to end.</p><div class="es-note">Cuando cuentas una historia de algo que ya pasó, todos los verbos se quedan en pasado — de principio a fin.</div></div>`;
  html += `<div class="howto-card no-print">
    <div class="ht-title">📋 How this activity works / Cómo funciona</div>
    <div class="howto-step"><div class="hs-num">1</div><p>Read the example.<span class="es">Lee el ejemplo.</span></p></div>
    <div class="howto-step"><div class="hs-num">2</div><p>Answer the quiz.<span class="es">Responde el quiz.</span></p></div>
    <div class="howto-step"><div class="hs-num">3</div><p>Tell your own story, all in the past.<span class="es">Cuenta tu propia historia, toda en pasado.</span></p></div>
  </div>`;
  EXAMPLES.forEach(ex=>{
    html += `<div class="before-after no-print">
      <div class="ba-before"><div class="ba-label">Before (mixed tense)</div><p>${ex.before}</p></div>
      <div class="ba-after"><div class="ba-label">After (all past tense)</div><p>${ex.after}</p></div>
      <div class="ba-why">💡 ${ex.why}</div>
    </div>`;
  });
  html += `<div class="tip-box no-print">💡 Quick check: read your story out loud. Does every action sound like it happened, or does one sentence sound like it\'s happening right now? That\'s your clue to fix it. / Truco rápido: lee tu historia en voz alta. ¿Suena como que ya pasó, o una oración suena como que está pasando ahora? Esa es tu pista para corregirlo.</div>`;
  html += `<div class="bottom-nav"><span></span><button class="nav-btn primary" onclick="goPhase(1)">Continue to Quiz →</button></div>`;
  el.innerHTML = html;
}
function renderQuiz(){
  const el = document.getElementById('phase-1');
  let html = `<div class="section-intro"><h2>Phase 2 — Quiz</h2><p>Read each situation and choose the best answer. No timer.</p><div class="es-note">Lee cada situación y elige la mejor respuesta. Sin tiempo límite.</div></div>`;
  QUIZ.forEach((q,qi)=>{
    const answered = quizAnswers[q.id] !== undefined;
    html += `<div class="quiz-card"><div class="quiz-num">Question ${qi+1} of ${QUIZ.length}</div><div class="quiz-situation"><strong>Situation:</strong> ${q.situation}</div><div class="quiz-prompt">${q.prompt}</div><div class="quiz-options">`;
    q.options.forEach((opt,oi)=>{
      let cls='';
      if(answered){ if(oi===q.correct) cls='revealed'; else if(quizAnswers[q.id]===oi) cls='incorrect'; }
      html += `<button class="q-opt ${cls}" data-qid="${q.id}" data-oi="${oi}" onclick="answerQuiz(this)"><span class="q-letter">${String.fromCharCode(65+oi)}</span><span class="q-text">${opt}</span></button>`;
    });
    html += `</div>`;
    if(answered){
      const correct = quizAnswers[q.id]===q.correct;
      html += `<div class="quiz-feedback ${correct?'correct':'incorrect'} show">${correct?'✓ ':'✗ '}${q.explain}${correct?`<div class="quiz-encourage">${q.encourage}</div>`:''}</div>`;
    }
    html += `</div>`;
  });
  const allDone = Object.keys(quizAnswers).length === QUIZ.length;
  const correctCount = QUIZ.filter(q=>quizAnswers[q.id]===q.correct).length;
  if(allDone){
    html += `<div class="results-card"><div class="result-score">${correctCount}<span class="result-denom">/${QUIZ.length}</span></div><div style="font-size:14px;color:var(--text3);margin-top:4px">correct</div><p class="result-note">${correctCount>=4?'Great! Time to tell your own story. 🌱':'Good try — review Phase 1 if you\'d like, then continue.'}</p></div>`;
  }
  html += `<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(0)">← Back to Learn</button><button class="nav-btn primary" onclick="goPhase(2)" ${allDone?'':'disabled'}>Continue to Write →</button></div>`;
  el.innerHTML = html;
}
function answerQuiz(btn){
  const qid=btn.dataset.qid, oi=parseInt(btn.dataset.oi);
  if(quizAnswers[qid]!==undefined) return;
  quizAnswers[qid]=oi;
  renderQuiz();
}
function renderWrite(){
  const el = document.getElementById('phase-2');
  let html = `<div class="section-intro"><h2>Phase 3 — Tell It All in the Past</h2><p>Pick a real school day and tell it — every verb in the past, from start to finish.</p><div class="es-note">Elige un día real de escuela y cuéntalo — todos los verbos en pasado, de principio a fin.</div></div>`;
  const val = writeAnswers.mystory || '';
  html += `<div class="write-card"><div class="write-reminder"><strong>Prompt:</strong> Write 4-6 sentences about a real school day. Use at least 3 connectors, and keep every verb in the past tense.<br><span style="font-style:italic">Escribe 4-6 oraciones sobre un día real de escuela. Usa al menos 3 conectores, y mantén todos los verbos en pasado.</span></div>
    <textarea class="write-ta" id="wta-story" placeholder="First, I ..." oninput="recordWrite(this.value)">${escHtml(val)}</textarea>
    <div class="word-bank no-print"><span class="wb-chip">First</span><span class="wb-chip">Then</span><span class="wb-chip">After that</span><span class="wb-chip">Next</span><span class="wb-chip">Finally</span></div>
    <div class="checklist no-print">
      <div class="cl-item"><div class="box"></div>Every verb is in the past</div>
      <div class="cl-item"><div class="box"></div>I used at least 3 connectors</div>
      <div class="cl-item"><div class="box"></div>Every sentence has a subject (I, we, the teacher...)</div>
    </div>
  </div>`;
  const done = val.trim().length > 15;
  html += `<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(1)">← Back to Quiz</button><div style="text-align:center"><div style="font-size:13px;color:var(--text3)">${done?'✓ Story started!':'Keep going...'}</div></div><button class="nav-btn" onclick="goPhase(0)">Restart ↺</button></div>`;
  html += `<div class="export-box"><button class="export-btn" onclick="window.print()">📄 Export written parts to PDF</button></div>`;
  el.innerHTML = html;
}
function recordWrite(val){ writeAnswers.mystory = val; }
function escHtml(str){ return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
renderLearn();
updateProgress();
</script>
</body>
</html>
