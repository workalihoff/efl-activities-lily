<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Listening — Office English | English with Ali</title>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --teal:#0F6E56;--teal-mid:#1D9E75;--teal-light:#E1F5EE;--teal-dark:#085041;
  --terra:#C4553A;--terra-light:#F5EAE7;
  --cream:#F7F5F0;--cream-dark:#EDE9E2;
  --text:#1A1A18;--text2:#4A4A47;--text3:#888780;
  --border:#E0DED8;--card:#fff;
  --green-bg:#EAF3DE;--green-t:#27500A;--green-b:#3B6D11;
  --red-bg:#FCEBEB;--red-t:#791F1F;
  --amber-bg:#FAEEDA;--amber-t:#633806;
  --blue-bg:#E6F1FB;--blue-t:#0C447C;
}
html{scroll-behavior:smooth}
body{font-family:'Lato',sans-serif;background:var(--cream);color:var(--text);min-height:100vh}
.topbar{background:var(--teal);padding:1rem 1.5rem;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Raleway',sans-serif;font-size:16px;font-weight:700;color:#fff}
.topbar-sub{font-size:12px;color:rgba(255,255,255,.6);margin-top:2px}
.prog-wrap{display:flex;align-items:center;gap:10px}
.prog-bar-bg{width:120px;height:6px;background:rgba(255,255,255,.2);border-radius:3px}
.prog-bar-fill{height:6px;border-radius:3px;background:#fff;transition:width .4s ease}
.prog-label{font-size:12px;color:rgba(255,255,255,.7);white-space:nowrap}
.shell{max-width:780px;margin:0 auto;padding:2rem 1rem 5rem}
.phase-nav{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:2rem}
.phase-tab{flex:1;padding:.75rem .5rem;text-align:center;cursor:pointer;border:none;background:transparent;font-family:'Lato',sans-serif;font-size:13px;font-weight:600;color:var(--text3);transition:all .2s;border-right:1px solid var(--border)}
.phase-tab:last-child{border-right:none}
.phase-tab.active{background:var(--teal);color:#fff}
.phase-tab .tab-num{display:block;font-size:18px;font-weight:700;margin-bottom:2px}
.phase-tab .tab-lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.section-intro{text-align:center;padding:2rem 0 1.5rem}
.section-intro h2{font-family:'Raleway',sans-serif;font-size:22px;font-weight:700;color:var(--teal);margin-bottom:.4rem}
.section-intro p{font-size:14px;color:var(--text3);max-width:520px;margin:0 auto}

/* listen card */
.listen-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.listen-header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.listen-icon{width:48px;height:48px;border-radius:12px;background:var(--teal-light);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.listen-title{font-family:'Raleway',sans-serif;font-size:18px;font-weight:700;color:var(--teal)}
.listen-meta{font-size:12px;color:var(--text3);margin-top:2px}
.listen-desc{font-size:14px;color:var(--text2);line-height:1.65;margin-bottom:1rem}
.listen-link{display:inline-flex;align-items:center;gap:.5rem;background:var(--teal);color:#fff;text-decoration:none;padding:.6rem 1.25rem;border-radius:10px;font-size:13px;font-weight:700;transition:background .2s}
.listen-link:hover{background:var(--teal-mid)}
.tip-box{background:var(--blue-bg);border-radius:8px;padding:.65rem .9rem;margin-top:1rem;font-size:13px;color:var(--blue-t);line-height:1.5}

/* pre-listening */
.pretask-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.pretask-title{font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;color:var(--terra);margin-bottom:.75rem}
.predict-items{display:flex;flex-direction:column;gap:.5rem}
.predict-item{background:var(--cream);border-radius:8px;padding:.65rem .9rem;font-size:13px;color:var(--text2);border-left:3px solid var(--terra);display:flex;align-items:flex-start;gap:.5rem}

/* quiz */
.quiz-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.quiz-num{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:.5rem}
.quiz-level{display:inline-block;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;margin-bottom:.5rem}
.quiz-level.comp{background:var(--teal-light);color:var(--teal-dark)}
.quiz-level.infer{background:var(--amber-bg);color:var(--amber-t)}
.quiz-level.apply{background:var(--terra-light);color:var(--terra)}
.quiz-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:1rem;line-height:1.5}
.quiz-options{display:flex;flex-direction:column;gap:7px}
.q-opt{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer;text-align:left;transition:all .15s;font-family:'Lato',sans-serif;width:100%}
.q-opt:hover{border-color:#9FE1CB;background:var(--teal-light)}
.q-opt.correct{border-color:var(--green-b);background:var(--green-bg)}
.q-opt.incorrect{border-color:#E24B4A;background:var(--red-bg)}
.q-opt.revealed{border-color:var(--green-b);background:var(--green-bg)}
.q-letter{min-width:22px;height:22px;border-radius:50%;border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--text3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.q-opt.correct .q-letter,.q-opt.revealed .q-letter{background:var(--green-b);border-color:var(--green-b);color:#fff}
.q-opt.incorrect .q-letter{background:#E24B4A;border-color:#E24B4A;color:#fff}
.q-text{font-size:14px;color:var(--text);line-height:1.5}
.quiz-feedback{margin-top:.75rem;padding:.65rem .9rem;border-radius:8px;font-size:13px;line-height:1.5;display:none}
.quiz-feedback.show{display:block}
.quiz-feedback.correct{background:var(--green-bg);color:var(--green-t);border-left:3px solid var(--green-b)}
.quiz-feedback.incorrect{background:var(--red-bg);color:var(--red-t);border-left:3px solid #E24B4A}

/* reflect */
.reflect-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:1.5rem;margin-bottom:1.25rem}
.reflect-prompt{font-size:15px;font-weight:600;color:var(--text);margin-bottom:.65rem;line-height:1.5}
.reflect-context{background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;padding:.6rem .9rem;font-size:13px;color:var(--teal-dark);margin-bottom:.75rem;line-height:1.5}
.reflect-ta{width:100%;min-height:80px;border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;font-size:14px;color:var(--text);font-family:'Lato',sans-serif;resize:vertical;outline:none;transition:border-color .15s;line-height:1.6;background:var(--cream)}
.reflect-ta:focus{border-color:var(--teal-mid);background:#fff;box-shadow:0 0 0 3px rgba(29,158,117,.1)}
.self-eval{margin-top:.75rem;display:none}
.self-eval.show{display:block}
.self-eval-lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-bottom:.4rem}
.self-btns{display:flex;gap:7px;flex-wrap:wrap}
.self-btn{padding:5px 14px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.self-btn.picked-yes{background:var(--green-bg);border-color:var(--green-b);color:var(--green-t)}
.self-btn.picked-unsure{background:var(--amber-bg);border-color:#BA7517;color:var(--amber-t)}
.self-btn.picked-no{background:var(--red-bg);border-color:#E24B4A;color:var(--red-t)}
.model-answer{margin-top:.75rem;padding:.65rem .9rem;background:var(--teal-light);border-left:3px solid var(--teal-mid);border-radius:0 8px 8px 0;font-size:13px;color:var(--teal-dark);line-height:1.55;display:none}
.model-answer.show{display:block}
.check-btn{margin-top:.75rem;padding:.5rem 1.1rem;border:1px solid var(--border);border-radius:8px;background:var(--card);font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s;font-family:'Lato',sans-serif}
.check-btn:hover{border-color:var(--teal-mid);color:var(--teal)}
.check-btn.done{background:var(--teal-light);border-color:var(--teal-mid);color:var(--teal-dark)}

/* results */
.results-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:2rem;text-align:center;margin-bottom:1.25rem}
.result-score{font-family:'Raleway',sans-serif;font-size:54px;font-weight:700;color:var(--teal);line-height:1}
.result-denom{font-size:20px;color:var(--text3)}
.result-note{font-size:14px;color:var(--text2);max-width:420px;margin:.75rem auto 0;line-height:1.6}
.bottom-nav{display:flex;justify-content:space-between;align-items:center;margin-top:2rem;padding-top:1.5rem;border-top:1px solid var(--border)}
.nav-btn{padding:.6rem 1.4rem;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Lato',sans-serif;transition:all .15s;border:1px solid var(--border);background:var(--card);color:var(--text)}
.nav-btn:hover{border-color:var(--teal-mid)}
.nav-btn.primary{background:var(--teal);border-color:var(--teal);color:#fff}
.nav-btn.primary:hover{background:var(--teal-mid)}
.nav-btn:disabled{opacity:.3;cursor:not-allowed}
@media(max-width:580px){.shell{padding:1.5rem .75rem 5rem}}
</style>
<style id="print-css">
@media print {
  body { background: #fff !important; }
  .topbar, .phase-nav, .botnav, #print-fab { display: none !important; }
  .shell { max-width: 100% !important; padding: 1rem !important; }
  .word-card, .quiz-card, .write-card, .reflect-card, .card, .listen-card, .pretask-card { break-inside: avoid; margin-bottom: 1rem; box-shadow: none !important; border: 1px solid #ddd !important; }
  .wc-body, .model-answer, .quiz-feedback, .self-eval { display: block !important; }
  .write-ta { min-height: 60px; border: 1px solid #ccc; background: #fff; }
  a { color: #0F6E56; }
}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="topbar-title">Listening — Office English</div>
    <div class="topbar-sub">English with Ali · Professional English</div>
  </div>
  <div class="prog-wrap">
    <div class="prog-bar-bg"><div class="prog-bar-fill" id="prog" style="width:0%"></div></div>
    <span class="prog-label" id="prog-label">Phase 1 of 3</span>
  </div>
</div>

<div class="shell">
  <div class="phase-nav">
    <div class="phase-tab active" id="tab-0" onclick="goPhase(0)"><span class="tab-num">1</span><span class="tab-lbl">Before</span></div>
    <div class="phase-tab" id="tab-1" onclick="goPhase(1)"><span class="tab-num">2</span><span class="tab-lbl">Listen</span></div>
    <div class="phase-tab" id="tab-2" onclick="goPhase(2)"><span class="tab-num">3</span><span class="tab-lbl">Reflect</span></div>
  </div>

  <div id="phase-0"></div>
  <div id="phase-1" style="display:none"></div>
  <div id="phase-2" style="display:none"></div>
</div>

<script>
let currentPhase = 0;
const quizAnswers = {};
const reflectAnswers = {};
const reflectSelf = {};

const QUIZ = [
  {
    id:'q1',
    level:'comp',
    levelLabel:'Comprehension',
    prompt:'Phil and Pippa say that job titles like "producer" or "project manager" can be confusing. Why?',
    options:[
      'Because they are too technical for most people to understand.',
      'Because they are generic and can mean very different things depending on the organization.',
      'Because they are only used in large companies.',
      'Because they are not official job titles.'
    ],
    correct:1,
    explain:'Correct. Phil and Pippa point out that generic titles like "consultant" or "project manager" can refer to very different roles depending on the organization — which is why describing what you actually do is more useful.'
  },
  {
    id:'q2',
    level:'comp',
    levelLabel:'Comprehension',
    prompt:'According to Pippa, what is a useful alternative to just saying your job title when talking to colleagues?',
    options:[
      'Telling them how long you have worked there.',
      'Using phrases like "I look after" or "I handle" to describe your responsibilities.',
      'Explaining your educational background.',
      'Listing all the projects you have worked on.'
    ],
    correct:1,
    explain:'Correct. Pippa suggests using action phrases like "I look after sales" or "I handle client complaints" — these are more concrete and meaningful than job titles alone.'
  },
  {
    id:'q3',
    level:'infer',
    levelLabel:'Inference',
    prompt:'Phil says: "I tend to find I just describe the things I do every day and hope that people work it out from there." What does this tell us about how he feels about his job title?',
    options:[
      'He is proud of his job title and likes to use it.',
      'He thinks his job title is clear and self-explanatory.',
      'He finds his job title inadequate to describe what he actually does.',
      'He believes job titles are the most important part of professional identity.'
    ],
    correct:2,
    explain:'Correct. Phil implies that his job title alone doesn\'t capture what he does — so he resorts to describing his daily tasks instead. This is a common experience in complex or cross-functional roles.'
  },
  {
    id:'q4',
    level:'infer',
    levelLabel:'Inference',
    prompt:'Pippa says: "Sometimes people who\'ve been there a long time still don\'t really understand it. They just use it every day." What is she referring to?',
    options:[
      'The difficulty of learning a new language.',
      'Internal jargon that people use habitually without fully understanding.',
      'The confusion caused by working in different time zones.',
      'The challenge of adapting to new technology at work.'
    ],
    correct:1,
    explain:'Correct. Pippa is talking about internal jargon — the specialized language used within an organization. Even long-term employees sometimes use it automatically without truly understanding what it means.'
  },
  {
    id:'q5',
    level:'apply',
    levelLabel:'Application',
    prompt:'You are attending an international human rights conference. Someone asks what you do. Which response best applies the advice from the podcast?',
    options:[
      '"I am a human rights officer."',
      '"I work in human rights, which is quite complex to explain."',
      '"I have a background in international law, which in practice means I monitor state compliance with human rights standards and report to UN bodies."',
      '"I do a lot of different things — it\'s hard to explain."'
    ],
    correct:2,
    explain:'Correct. This response uses the phrase "I have a background in... which in practice means..." — exactly the structure Pippa recommends for explaining your role clearly to people outside your organization. It gives context, a concrete description, and avoids vague language.'
  },
  {
    id:'q6',
    level:'apply',
    levelLabel:'Application',
    prompt:'What are "transferable skills" according to Phil?',
    options:[
      'Skills you learn in a training course that can be added to your CV.',
      'Skills from your current or past job that can be used in a different role or industry.',
      'Technical skills specific to one job that cannot be used elsewhere.',
      'Language skills that help you work internationally.'
    ],
    correct:1,
    explain:'Correct. Phil defines transferable skills as abilities you develop in one job that remain useful and applicable in a different role or industry — for example, persuasion skills from sales that could be valuable in another field.'
  }
];

const REFLECT = [
  {
    id:'r1',
    prompt:'How would you describe your current role using the phrase "I look after..." or "I handle..."?',
    context:'💡 Think about your actual daily responsibilities — not your official job title.',
    model:'I look after human rights monitoring in Guatemala, which in practice means I track state compliance and draft reports for UN bodies. / I handle coordination between local teams and international partners, which means I translate priorities into action on the ground.'
  },
  {
    id:'r2',
    prompt:'In the podcast, Phil mentions "reporting to" someone to give context to your role. Write a sentence that explains where you sit in your organization — who you report to and who you work closely with.',
    context:'💡 This is about organizational context — helping someone understand your position, not just your tasks.',
    model:'I report to the Head of Office and work closely with the legal team and our focal points in the field. / I report to the Regional Director and coordinate regularly with HR, communications, and program teams.'
  },
  {
    id:'r3',
    prompt:'Think about the context you\'re preparing for — Geneva or Pretoria. Write 2–3 sentences introducing yourself professionally to someone you\'ve just met at an international event. Use at least one phrase from the podcast.',
    context:'💡 Use: "I have a background in...", "which in practice means...", "I\'m responsible for...", or "I look after..."',
    model:'Hi, I\'m Gabriela. I have a background in human rights law, which in practice means I work on monitoring and accountability mechanisms for LGBTI persons and women in Guatemala. I\'m here to strengthen my skills in applying international standards to law enforcement contexts. / I\'m Vincent. I\'m a Human Rights Officer — I\'m responsible for supporting regional monitoring and capacity-building across Southern Africa. I\'ve just relocated to Pretoria and I\'m looking forward to learning from colleagues across the region.'
  }
];

function updateProgress(){
  const pcts=[33,66,100];
  const labels=['Phase 1 of 3 — Before you listen','Phase 2 of 3 — Listen & Answer','Phase 3 of 3 — Reflect'];
  document.getElementById('prog').style.width=pcts[currentPhase]+'%';
  document.getElementById('prog-label').textContent=labels[currentPhase];
}

function goPhase(n){
  document.getElementById('phase-'+currentPhase).style.display='none';
  document.querySelectorAll('.phase-tab').forEach((t,i)=>t.classList.toggle('active',i===n));
  currentPhase=n;
  document.getElementById('phase-'+n).style.display='block';
  updateProgress();
  window.scrollTo({top:0,behavior:'smooth'});
  if(n===1)renderListen();
  if(n===2)renderReflect();
}

function renderBefore(){
  const el=document.getElementById('phase-0');
  let html=`<div class="section-intro"><h2>Phase 1 — Before You Listen</h2><p>Activate what you already know. Think about these questions before pressing play.</p></div>`;
  html+=`<div class="pretask-card">
    <div class="pretask-title">🧠 Think about this first</div>
    <div class="predict-items">
      <div class="predict-item">💭 How do you currently describe your job to someone who doesn't work in human rights?</div>
      <div class="predict-item">💭 Have you ever struggled to explain your role — in English or in Spanish? What made it hard?</div>
      <div class="predict-item">💭 What do you think "transferable skills" means? Make a guess before you listen.</div>
    </div>
  </div>`;
  html+=`<div class="tip-box">💡 <strong>Listening strategy for today:</strong> This is a natural conversation between two native speakers. Don't try to catch every word — focus on the main ideas and the key phrases they recommend. You'll use those phrases in Phase 3.</div>`;
  html+=`<div class="bottom-nav"><span style="font-size:13px;color:var(--text3)">Take 2–3 minutes to think before moving on.</span><button class="nav-btn primary" onclick="goPhase(1)">Ready to listen →</button></div>`;
  el.innerHTML=html;
}

function renderListen(){
  const el=document.getElementById('phase-1');
  let html=`<div class="section-intro"><h2>Phase 2 — Listen & Answer</h2><p>Listen to the episode, then answer the questions. You can listen more than once.</p></div>`;
  html+=`<div class="listen-card">
    <div class="listen-header">
      <div class="listen-icon">🎧</div>
      <div><div class="listen-title">BBC Office English — How to describe your job</div><div class="listen-meta">~9 min · Natural pace · Two native speakers</div></div>
    </div>
    <div class="listen-desc">Phil and Pippa discuss how to explain your job title and describe what you do — inside your organization, to clients, and when applying for new roles. Listen for the key phrases they recommend.</div>
    <a class="listen-link" href="https://www.bbc.co.uk/learningenglish/english/features/office-english/260330" target="_blank">🔗 Open BBC episode</a>
    <div class="tip-box">💡 Listen once for the general idea. Then listen again while answering the questions below. It's fine to pause and rewind.</div>
  </div>`;

  const levelColors={comp:'comp',infer:'infer',apply:'apply'};
  const levelLabels={comp:'Comprehension',infer:'Inference',apply:'Application'};

  QUIZ.forEach((q,qi)=>{
    const answered=quizAnswers[q.id]!==undefined;
    html+=`<div class="quiz-card">
      <div class="quiz-num">Question ${qi+1} of ${QUIZ.length}</div>
      <span class="quiz-level ${q.level}">${levelLabels[q.level]}</span>
      <div class="quiz-prompt">${q.prompt}</div>
      <div class="quiz-options">`;
    q.options.forEach((opt,oi)=>{
      let cls='';
      if(answered){
        if(oi===q.correct)cls='revealed';
        else if(quizAnswers[q.id]===oi)cls='incorrect';
      }
      html+=`<button class="q-opt ${cls}" onclick="answerQuiz(this)" data-qid="${q.id}" data-oi="${oi}">
        <span class="q-letter">${String.fromCharCode(65+oi)}</span>
        <span class="q-text">${opt}</span>
      </button>`;
    });
    html+=`</div>`;
    if(answered){
      const ok=quizAnswers[q.id]===q.correct;
      html+=`<div class="quiz-feedback ${ok?'correct':'incorrect'} show">${ok?'✓ ':'✗ '}${q.explain}</div>`;
    }
    html+=`</div>`;
  });

  const allDone=Object.keys(quizAnswers).length===QUIZ.length;
  const correct=QUIZ.filter(q=>quizAnswers[q.id]===q.correct).length;
  if(allDone){
    html+=`<div class="results-card">
      <div class="result-score">${correct}<span class="result-denom">/${QUIZ.length}</span></div>
      <div style="font-size:14px;color:var(--text3);margin-top:4px">correct</div>
      <p class="result-note">${correct>=5?'Strong work. You\'re listening for meaning, not just words — that\'s the skill that matters. Move on to Phase 3.':correct>=4?'Good. Review the questions you missed, then continue to the reflection phase.':'Listen to the episode again before moving to Phase 3. Focus on the phrases Phil and Pippa recommend.'}</p>
    </div>`;
  }
  html+=`<div class="bottom-nav"><button class="nav-btn" onclick="goPhase(0)">← Before</button><button class="nav-btn primary" onclick="goPhase(2)" ${allDone?'':'disabled'}>Reflect →</button></div>`;
  el.innerHTML=html;
}

function answerQuiz(btn){
  const qid=btn.dataset.qid;
  const oi=parseInt(btn.dataset.oi);
  if(quizAnswers[qid]!==undefined)return;
  quizAnswers[qid]=oi;
  renderListen();
  setTimeout(()=>{
    const fb=document.querySelector('#phase-1 .quiz-feedback.show:last-of-type');
    if(fb)fb.scrollIntoView({behavior:'smooth',block:'nearest'});
  },80);
}

function renderReflect(){
  const el=document.getElementById('phase-2');
  let html=`<div class="section-intro"><h2>Phase 3 — Reflect & Apply</h2><p>Now use what you heard. Write your answers in English — connect the podcast directly to your own professional context.</p></div>`;
  REFLECT.forEach((r,ri)=>{
    const val=reflectAnswers[ri]||'';
    const selfVal=reflectSelf[ri]||'';
    const showSelf=val.trim().length>15;
    const showModel=selfVal!=='';
    html+=`<div class="reflect-card">
      <div class="quiz-num">Reflection ${ri+1} of ${REFLECT.length}</div>
      <div class="reflect-prompt">${r.prompt}</div>
      <div class="reflect-context">${r.context}</div>
      <textarea class="reflect-ta" id="rta-${ri}" placeholder="Write your answer here…" oninput="recordReflect(${ri},this.value)">${escHtml(val)}</textarea>
      <div class="self-eval ${showSelf?'show':''}" id="rse-${ri}">
        <div class="self-eval-lbl">How did this feel?</div>
        <div class="self-btns">
          <button class="self-btn ${selfVal==='yes'?'picked-yes':''}" onclick="pickSelf(${ri},'yes',this)">✓ Felt natural</button>
          <button class="self-btn ${selfVal==='unsure'?'picked-unsure':''}" onclick="pickSelf(${ri},'unsure',this)">? Not sure</button>
          <button class="self-btn ${selfVal==='no'?'picked-no':''}" onclick="pickSelf(${ri},'no',this)">✗ Struggled</button>
        </div>
      </div>
      <button class="check-btn ${showModel?'done':''}" onclick="showModel(${ri})">${showModel?'✓ Example shown':'See an example answer'}</button>
      <div class="model-answer ${showModel?'show':''}" id="rma-${ri}">
        <strong>Example answers:</strong><br>${r.model}<br>
        <span style="font-size:11px;color:var(--teal);margin-top:4px;display:block">Your answer doesn't need to match — what matters is that you use the phrases naturally in your own context.</span>
      </div>
    </div>`;
  });
  const done=Object.values(reflectAnswers).filter(v=>v&&v.trim().length>10).length;
  html+=`<div class="bottom-nav">
    <button class="nav-btn" onclick="goPhase(1)">← Listen</button>
    <div style="text-align:center">
      <div style="font-size:13px;color:var(--text3)">${done} of ${REFLECT.length} completed</div>
      ${done>=REFLECT.length?'<div style="font-size:13px;font-weight:600;color:var(--teal)">✓ Done! Submit or send to Ali on WhatsApp.</div>':''}
    </div>
    <button class="nav-btn" onclick="goPhase(0)">Restart ↺</button>
  </div>`;
  el.innerHTML=html;
}

function recordReflect(ri,val){
  reflectAnswers[ri]=val;
  const se=document.getElementById('rse-'+ri);
  if(se)se.className='self-eval'+(val.trim().length>15?' show':'');
}
function pickSelf(ri,val,btn){
  reflectSelf[ri]=val;
  btn.closest('.self-btns').querySelectorAll('.self-btn').forEach(b=>b.className='self-btn');
  btn.classList.add(val==='yes'?'picked-yes':val==='unsure'?'picked-unsure':'picked-no');
  document.getElementById('rma-'+ri).classList.add('show');
  const btns=document.querySelectorAll('#phase-2 .check-btn');
  if(btns[ri])btns[ri].classList.add('done');
}
function showModel(ri){
  document.getElementById('rma-'+ri).classList.add('show');
  const btns=document.querySelectorAll('#phase-2 .check-btn');
  if(btns[ri])btns[ri].classList.add('done');
  const val=reflectAnswers[ri]||'';
  const se=document.getElementById('rse-'+ri);
  if(se&&val.trim().length>15)se.classList.add('show');
}
function escHtml(str){return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

renderBefore();
updateProgress();
</script>

<div id="print-fab" style="position:fixed;bottom:1.5rem;right:1.5rem;z-index:999">
  <button onclick="exportPDF()" style="display:flex;align-items:center;gap:.5rem;background:#0F6E56;color:#fff;border:none;border-radius:12px;padding:.65rem 1.25rem;font-family:'Lato',sans-serif;font-size:13px;font-weight:700;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.2);transition:all .2s" onmouseover="this.style.background='#1D9E75'" onmouseout="this.style.background='#0F6E56'">
    📄 Export as PDF
  </button>
</div>

<script>
function exportPDF(){
  // 1. Show all hidden phases/sections
  const hidden = document.querySelectorAll('[style*="display:none"], [style*="display: none"]');
  const hiddenEls = [];
  hidden.forEach(el => {
    hiddenEls.push({el, style: el.getAttribute('style')});
    el.style.display = 'block';
  });

  // 2. Hide the FAB itself
  document.getElementById('print-fab').style.display = 'none';

  // 3. Also hide nav buttons and topbar dots for cleaner output
  const navEls = document.querySelectorAll('.botnav, .topbar, .phase-nav, #print-fab');
  navEls.forEach(el => el.style.display = 'none');

  // 4. Print
  window.print();

  // 5. Restore everything after print dialog closes
  setTimeout(() => {
    hiddenEls.forEach(({el, style}) => el.setAttribute('style', style));
    navEls.forEach(el => el.style.display = '');
    document.getElementById('print-fab').style.display = 'flex';
  }, 500);
}
</script>

</body>
</html>
